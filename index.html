<!DOCTYPE html>
<html lang="en">

    <head>
        <!-- meta info -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

        <!-- favicon -->
        <link rel="shortcut icon" href="assets/christian-peraza-favicon-32x32.jpg" type="image/x-icon">

        <!-- title -->
        <title>Christian Peraza | Personal Link Tree</title>

        <!-- styles -->
        <link rel="stylesheet" href="css/index.css">
    </head>

    <body>
        <!-- button: dark mode -->
        <div id="buttonContainer">
            <button title="Activate Dark Mode" id="buttonContainer-btn"></button>
        </div>

        <!-- header -->
        <header id="header">
            <div id="headerProfile">
                <img id="header-img" src="assets/christian-peraza-perfil.webp" alt="Christian Peraza's face" width="80">

                <div id="header-titles">
                    <h1 id="header-name">Christian Peraza</h1>
                    <h2 id="header-major">Full-stack Developer</h2>
                </div>
            </div>

            <div id="headerInfo">
                <h3 id="header-currentStatus">Current BYU-Idaho student</h3>

                <div id="header-location">
                    <img id="header-mapIcon" src="assets/maps-pin-line-icon.svg" alt="Map pin" width="18">
                    <h3 id="header-stateCountry">Sao Paulo, Brazil</h3>
                </div>

                <ul id="header-skills">
                    <li class="header-skillsItem">
                        <img class="skillsIcon javascript" src="assets/javascript-programming-language-icon.svg" alt="JavaScript logo" width="24">
                    </li>
                    <li class="header-skillsItem">
                        <img class="skillsIcon react" src="assets/react-js-icon.svg" alt="React.js logo" width="24">
                    </li>
                </ul>
            </div>
        </header>

    </body>

</html>
