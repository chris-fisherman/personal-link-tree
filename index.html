<!DOCTYPE html>
<html lang="en">

    <head>
        <!-- meta info -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

        <!-- favicon -->
        <link rel="shortcut icon" href="assets/christian-peraza-favicon-32x32.jpg" type="image/x-icon">

        <!-- title -->
        <title>Christian Peraza | Personal Link Tree</title>

        <!-- styles -->
        <link rel="stylesheet" href="css/index.css">
    </head>

    <body>
        <!-- button: dark mode -->
        <div id="buttonContainer">
            <button title="Activate Dark Mode" id="buttonContainer-btn"></button>
        </div>

        <!-- header -->
        <header id="header">
            <div id="headerProfile">
                <img id="header_img" src="assets/christian-peraza-perfil.webp" alt="Christian Peraza's face" width="80">

                <div id="header_titles">
                    <h1 id="header_name">Christian Peraza</h1>
                    <h2 id="header_major">Full-stack Developer</h2>
                </div>
            </div>

            <div id="headerInfo">
                <h3 id="header_currentStatus">Current BYU-Idaho student</h3>

                <div id="header_location">
                    <img id="header_mapIcon" src="assets/maps-pin-line-icon.svg" alt="Map pin" width="18">
                    <h3 id="header_stateCountry">Sao Paulo, Brazil</h3>
                </div>

                <ul id="header_skills">
                    <li class="header_skillsItem">
                        <img class="skillsIcon" id="javascriptIcon" src="assets/javascript-programming-language-icon.svg" alt="JavaScript logo" width="24">
                    </li>
                    <li class="header_skillsItem">
                        <img class="skillsIcon" id="reactIcon" src="assets/react-js-icon.svg" alt="React.js logo" width="24">
                    </li>
                </ul>
            </div>
        </header>

        <!-- main -->
        <main id="main">
            <!-- list main-->
            <ul id="main_list">
                <li class="main_listItem">
                    <a title="Check my Portfolio" href="#" class="main_listLink">
                        <img src="assets/folder-open-outline.svg" alt="Folder icon" width="24" class="main_listIcon">
                        <div class="main_listTitles_container">
                            <h1 class="main_listTitle">Personal Portfolio</h1>
                            <h2 class="main_listSubTitle">All my lastest projects</h2>
                        </div>
                    </a>
                </li>
                <li class="main_listItem">
                    <a title="Check my Portfolio" href="#" class="main_listLink">
                        <img src="assets/folder-open-outline.svg" alt="Folder icon" width="24" class="main_listIcon">
                        <div class="main_listTitles_container">
                            <h1 class="main_listTitle">Personal Portfolio</h1>
                            <h2 class="main_listSubTitle">All my lastest projects</h2>
                        </div>
                    </a>
                </li>
                <li class="main_listItem">
                    <a title="Check my Portfolio" href="#" class="main_listLink">
                        <img src="assets/folder-open-outline.svg" alt="Folder icon" width="24" class="main_listIcon">
                        <div class="main_listTitles_container">
                            <h1 class="main_listTitle">Personal Portfolio</h1>
                            <h2 class="main_listSubTitle">All my lastest projects</h2>
                        </div>
                    </a>
                </li>
            </ul>

            <!-- email link main -->
            <a title="Email" id="main_emailLink" href="#">
                <img id="emailLink_icon" src="assets/mail-outline.svg" alt="Mail icon" width="24">
                <h1 id="emailLink_title">Let's connect!</h1>
            </a>
        </main>

        <!-- footer -->
        <footer id="footer">
            <!-- social media footer -->
            <ul id="socialMedia_list">
                <li class="socialMedia_item">
                    <a title="GitHub" href="#" class="socialMedia_link">
                        <img src="assets/logo-github.svg" alt="GitHub logo" width="24" class="socialMedia_icon" id="githubIcon">
                    </a>
                </li>
                <li class="socialMedia_Item">
                    <a title="LinkedIn" href="#" class="socialMedia_link">
                        <img src="assets/logo-linkedin.svg" alt="LinkedIn logo" width="24" class="socialMedia_icon" id="linkedinIcon">
                    </a>
                </li>
                <li class="socialMedia_Item">
                    <a title="Instagram" href="#" class="socialMedia_link">
                        <img src="assets/logo-instagram.svg" alt="Instagram logo" width="24" class="socialMedia_icon" id="instagramIcon">
                    </a>
                </li>
                <li class="socialMedia_Item">
                    <a title="Facebook" href="#" class="socialMedia_link">
                        <img src="assets/logo-facebook.svg" alt="Facebook logo" width="24" class="socialMedia_icon" id="facebookIcon">
                    </a>
                </li>
            </ul>

            <!-- credits footer -->
            <p id="footer_credits">Made by Christian Peraza</p>
        </footer>

        <!-- scripts -->
        <script src="#"></script>
    </body>

</html>
